[workspace]
members = ["crates/protocol", "server"]
resolver = "3"

[workspace.package]
version = "0.1.31"
edition = "2024"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
